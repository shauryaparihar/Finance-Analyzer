# Render Blueprint for the API. The database is external (see docs/deployment.md), so DATABASE_URL is entered by hand.
services:
  - type: web
    name: finance-analyzer-pdup
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # No dockerCommand: the Dockerfile CMD applies migrations (the free plan has no pre-deploy hook), then starts the API.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://finance-analyzer-nu.vercel.app
      - key: DATABASE_URL
        sync: false  # paste the PostgreSQL connection string in the Render dashboard; never commit it
