[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os
# The database URL is taken from the DATABASE_URL environment variable (see backend/migrations/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Migration output is JSON like the rest of the application's logs.
class = backend.core.logging.JsonFormatter
